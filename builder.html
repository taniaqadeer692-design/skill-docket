<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - SkillDocket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <div class="text-2xl font-bold text-blue-600 tracking-wide">SkillDocket</div>
        <div class="space-x-6">
            <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">Home</a>
            <a href="login.html" class="text-gray-600 hover:text-blue-600 font-medium">Logout</a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="max-w-3xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-md border border-gray-100">
        <div class="mb-8 border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-800">Create Your Resume</h2>
            <p class="text-gray-500 text-sm mt-1">Fill in your details and upload a photo to generate your CV.</p>
        </div>

        <form id="resumeForm" onsubmit="generateResume(event)">
            <!-- Personal Info -->
            <h3 class="text-lg font-semibold text-blue-600 mb-4">1. Personal Information & Photo</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Full Name</label>
                    <input type="text" id="fullName" placeholder="Tania Qadeer" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Job Title / Profession</label>
                    <input type="text" id="jobTitle" placeholder="Software Engineering Student" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                    <input type="email" id="email" placeholder="tania@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Phone</label>
                    <input type="text" id="phone" placeholder="+92 300 1234567" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Location</label>
                    <input type="text" id="location" placeholder="Lahore, Pakistan" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
            </div>

            <!-- Profile Picture Upload -->
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Upload Profile Picture</label>
                <input type="file" id="profileImage" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
            </div>

            <!-- Education -->
            <h3 class="text-lg font-semibold text-blue-600 mb-4 mt-8">2. Education</h3>
            <div class="mb-6">
                <textarea id="education" rows="2" placeholder="BS Computer Science - University Name (2022 - 2026)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- Experience -->
            <h3 class="text-lg font-semibold text-blue-600 mb-4 mt-8">3. Experience / Projects</h3>
            <div class="mb-6">
                <textarea id="experience" rows="3" placeholder="Web Development Intern at XYZ Company..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- Skills -->
            <h3 class="text-lg font-semibold text-blue-600 mb-4 mt-8">4. Skills</h3>
            <div class="mb-8">
                <input type="text" id="skills" placeholder="HTML, CSS, JavaScript, Git" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold hover:bg-blue-700 transition shadow-lg text-lg">
                Generate Modern Resume
            </button>
        </form>
    </div>

    <!-- JavaScript to transfer data to resume.html -->
    <script>
        function generateResume(event) {
            event.preventDefault();

            // Collect form data
            const data = {
                fullName: document.getElementById('fullName').value,
                jobTitle: document.getElementById('jobTitle').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                education: document.getElementById('education').value,
                experience: document.getElementById('experience').value,
                skills: document.getElementById('skills').value
            };

            // Handle Profile Image
            const fileInput = document.getElementById('profileImage');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    data.profileImage = e.target.result;
                    localStorage.setItem('resumeData', JSON.stringify(data));
                    window.location.href = 'resume.html'; // Redirect to template page
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                data.profileImage = '';
                localStorage.setItem('resumeData', JSON.stringify(data));
                window.location.href = 'resume.html'; // Redirect to template page
            }
        }
    </script>
</body>
</html>
