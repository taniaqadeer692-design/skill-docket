<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume - SkillDocket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 font-sans py-10 px-4">

    <!-- Top Action Bar -->
    <div class="max-w-4xl mx-auto mb-6 flex justify-between items-center bg-white/10 backdrop-blur p-4 rounded-2xl shadow-lg border border-white/10">
        <a href="templates.html" class="text-white font-semibold hover:text-blue-400 transition">&larr; Choose Templates</a>
        <span id="badge" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Template Active</span>
        <button onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold shadow-md transition">Download PDF</button>
    </div>

    <!-- Resume Canvas Container -->
    <div id="resumeContainer" class="max-w-4xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const data = JSON.parse(localStorage.getItem('resumeData')) || {};
        const templateId = urlParams.get('template') || data.templateId || '1';

        document.getElementById('badge').innerText = `Template ${templateId} Active`;

        function formatBullets(text) {
            if(!text) return '<p class="text-slate-400 italic">No details provided.</p>';
            return text.split('\n').map(l => l.trim() ? `<div class="flex items-start gap-2 mb-1.5"><span class="text-blue-600 font-bold">•</span><span class="text-slate-700">${l.replace(/^[•\-\*]\s*/, '')}</span></div>` : '').join('');
        }
        
        function formatSkills(skills) {
            if(!skills) return '<span class="text-slate-400 italic">No skills added.</span>';
            return skills.split(',').map(s => s.trim() ? `<span class="bg-slate-100 text-slate-800 px-3 py-1 rounded-lg text-xs font-semibold inline-block m-0.5 border border-slate-200">${s}</span>` : '').join('');
        }

        const container = document.getElementById('resumeContainer');
        let html = '';

        // --- 6 POLISHED TEMPLATES ---
        if (templateId === '1') {
            // TEMPLATE 1: Dark Sidebar Modern
            html = `
                <div class="grid grid-cols-3 min-h-[850px]">
                    <div class="col-span-1 bg-slate-900 text-slate-100 p-8 flex flex-col justify-between">
                        <div>
                            ${data.profileImage ? `<div class="mb-6 flex justify-center"><img src="${data.profileImage}" class="w-32 h-32 object-cover rounded-2xl border-2 border-blue-500 shadow"></div>` : ''}
                            <h3 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-3 pb-1 border-b border-slate-700">Contact</h3>
                            <p class="text-xs text-slate-300 mb-1.5 break-words">📧 ${data.email || ''}</p>
                            <p class="text-xs text-slate-300 mb-1.5">📞 ${data.phone || ''}</p>
                            <p class="text-xs text-slate-300 mb-6">📍 ${data.location || ''}</p>
                            
                            <h3 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-3 pb-1 border-b border-slate-700">Skills</h3>
                            <div class="flex flex-wrap">${formatSkills(data.skills)}</div>
                        </div>
                    </div>
                    <div class="col-span-2 p-10 bg-white text-slate-900 flex flex-col justify-between">
                        <div>
                            <div class="border-b border-slate-200 pb-6 mb-6">
                                <h1 class="text-4xl font-black">${data.fullName || 'Your Name'}</h1>
                                <p class="text-lg font-bold text-blue-600 mt-1 uppercase tracking-wide">${data.jobTitle || 'Profession'}</p>
                            </div>
                            <div class="mb-8">
                                <h3 class="text-sm font-black uppercase tracking-wider text-slate-400 mb-3">Experience & Projects</h3>
                                <div>${formatBullets(data.experience)}</div>
                            </div>
                            <div>
                                <h3 class="text-sm font-black uppercase tracking-wider text-slate-400 mb-3">Education</h3>
                                <div>${formatBullets(data.education)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        } 
        else if (templateId === '2') {
            // TEMPLATE 2: Executive Split-Grid (With dark professional top border line)
            html = `
                <div class="p-10 bg-white text-slate-900 min-h-[850px]">
                    <div class="border-b-4 border-teal-700 pb-6 mb-8 flex justify-between items-center border-t-2 border-slate-900 pt-4">
                        <div class="flex items-center gap-4">
                            ${data.profileImage ? `<img src="${data.profileImage}" class="w-20 h-20 object-cover rounded-full border-2 border-teal-700 shadow">` : ''}
                            <div>
                                <h1 class="text-3xl font-black">${data.fullName || 'Your Name'}</h1>
                                <p class="text-md font-bold text-teal-700 uppercase tracking-wide">${data.jobTitle || 'Profession'}</p>
                            </div>
                        </div>
                        <div class="text-right text-xs text-slate-600 space-y-1">
                            <p>✉️ ${data.email || ''}</p><p>📞 ${data.phone || ''}</p><p>📍 ${data.location || ''}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-teal-700 border-y border-r border-slate-200">
                            <h3 class="text-xs font-black text-teal-700 mb-3 uppercase tracking-wider">Education</h3>
                            <div class="text-xs">${formatBullets(data.education)}</div>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-teal-700 border-y border-r border-slate-200">
                            <h3 class="text-xs font-black text-teal-700 mb-3 uppercase tracking-wider">Core Skills</h3>
                            <div class="flex flex-wrap">${formatSkills(data.skills)}</div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-teal-700 border-y border-r border-slate-200">
                        <h3 class="text-xs font-black text-teal-700 mb-3 uppercase tracking-wider">Experience & Projects</h3>
                        <div class="text-xs">${formatBullets(data.experience)}</div>
                    </div>
                </div>
            `;
        }
        else if (templateId === '3') {
            // TEMPLATE 3: Corporate Top-Header Banner
            html = `
                <div class="p-10 bg-white text-slate-900 min-h-[850px]">
                    <div class="flex items-center gap-6 bg-indigo-950 text-white p-8 rounded-2xl mb-8 shadow-lg border-b-4 border-indigo-500">
                        ${data.profileImage ? `<img src="${data.profileImage}" class="w-24 h-32 object-cover rounded-xl border-2 border-white/30 shadow">` : ''}
                        <div>
                            <h1 class="text-3xl font-black">${data.fullName || 'Your Name'}</h1>
                            <p class="text-md font-semibold text-indigo-300 mt-1 uppercase">${data.jobTitle || 'Profession'}</p>
                            <p class="text-xs text-indigo-200 mt-3">✉️ ${data.email || ''} &bull; 📞 ${data.phone || ''} &bull; 📍 ${data.location || ''}</p>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-indigo-900 mb-3 border-b-2 border-indigo-900 pb-1">Experience & Projects</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.experience)}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-indigo-900 mb-3 border-b-2 border-indigo-900 pb-1">Education</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.education)}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-indigo-900 mb-3 border-b-2 border-indigo-900 pb-1">Core Skills</h3>
                            <div class="flex flex-wrap">${formatSkills(data.skills)}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        else if (templateId === '4') {
            // TEMPLATE 4: Minimalist Elegant (Center-Aligned with clean dark frame)
            html = `
                <div class="p-12 text-center bg-amber-50/20 min-h-[850px] flex flex-col justify-between border-8 border-slate-900 m-2 rounded-xl">
                    <div>
                        ${data.profileImage ? `<div class="mb-4 flex justify-center"><img src="${data.profileImage}" class="w-24 h-24 object-cover rounded-full border-2 border-amber-800 shadow"></div>` : ''}
                        <h1 class="text-4xl font-serif font-bold text-slate-900">${data.fullName || 'Your Name'}</h1>
                        <p class="text-sm font-bold tracking-widest uppercase text-amber-800 mt-1">${data.jobTitle || 'Profession'}</p>
                        <p class="text-xs text-slate-500 mt-2">✉️ ${data.email || ''} &bull; 📞 ${data.phone || ''} &bull; 📍 ${data.location || ''}</p>
                        
                        <div class="w-20 h-1 bg-slate-900 mx-auto my-6"></div>
                        
                        <div class="text-left space-y-6 max-w-2xl mx-auto">
                            <div>
                                <h3 class="text-xs font-black uppercase tracking-widest text-amber-900 mb-2 text-center border-b border-amber-200 pb-1">Experience & Projects</h3>
                                <div class="text-sm text-slate-700">${formatBullets(data.experience)}</div>
                            </div>
                            <div>
                                <h3 class="text-xs font-black uppercase tracking-widest text-amber-900 mb-2 text-center border-b border-amber-200 pb-1">Education</h3>
                                <div class="text-sm text-slate-700">${formatBullets(data.education)}</div>
                            </div>
                            <div>
                                <h3 class="text-xs font-black uppercase tracking-widest text-amber-900 mb-2 text-center border-b border-amber-200 pb-1">Core Skills</h3>
                                <div class="flex flex-wrap justify-center">${formatSkills(data.skills)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        else if (templateId === '5') {
            // TEMPLATE 5: Creative Timeline Style (With sharp dark borders)
            html = `
                <div class="p-10 border-l-8 border-slate-900 bg-white text-slate-900 min-h-[850px]">
                    <div class="mb-8 flex justify-between items-start border-b-2 border-slate-900 pb-4">
                        <div>
                            <span class="bg-emerald-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">Creative Layout</span>
                            <h1 class="text-4xl font-black text-slate-900 mt-2">${data.fullName || 'Your Name'}</h1>
                            <p class="text-md font-bold text-emerald-700 uppercase">${data.jobTitle || 'Profession'}</p>
                            <p class="text-xs text-slate-500 mt-2">✉️ ${data.email || ''} | 📞 ${data.phone || ''} | 📍 ${data.location || ''}</p>
                        </div>
                        ${data.profileImage ? `<img src="${data.profileImage}" class="w-24 h-24 object-cover rounded-xl border-2 border-slate-900 shadow">` : ''}
                    </div>
                    <div class="space-y-6">
                        <div class="bg-emerald-50/40 p-6 rounded-xl border-l-4 border-emerald-700 border-y border-r border-slate-200">
                            <h3 class="text-xs font-black uppercase tracking-widest text-emerald-900 mb-3">Experience & Projects</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.experience)}</div>
                        </div>
                        <div class="bg-emerald-50/40 p-6 rounded-xl border-l-4 border-emerald-700 border-y border-r border-slate-200">
                            <h3 class="text-xs font-black uppercase tracking-widest text-emerald-900 mb-3">Education</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.education)}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-emerald-900 mb-3">Core Skills</h3>
                            <div class="flex flex-wrap">${formatSkills(data.skills)}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        else if (templateId === '6') {
            // TEMPLATE 6: Executive Dark Purple Header Banner (Fixed to deep purple theme!)
            html = `
                <div class="bg-white text-slate-900 min-h-[850px]">
                    <div class="bg-purple-950 text-white p-10 flex items-center justify-between border-b-4 border-purple-600">
                        <div class="flex items-center gap-4">
                            ${data.profileImage ? `<img src="${data.profileImage}" class="w-20 h-20 object-cover rounded-full border-2 border-purple-400 shadow">` : ''}
                            <div>
                                <h1 class="text-3xl font-black text-purple-300">${data.fullName || 'Your Name'}</h1>
                                <p class="text-md font-semibold tracking-wide text-slate-200 mt-1 uppercase">${data.jobTitle || 'Profession'}</p>
                            </div>
                        </div>
                        <div class="text-right text-xs text-slate-300 space-y-1">
                            <p>✉️ ${data.email || ''}</p><p>📞 ${data.phone || ''}</p><p>📍 ${data.location || ''}</p>
                        </div>
                    </div>
                    <div class="p-10 space-y-6">
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-purple-900 mb-3 border-b-2 border-purple-900 pb-1">Experience & Projects</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.experience)}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-purple-900 mb-3 border-b-2 border-purple-900 pb-1">Education</h3>
                            <div class="text-sm text-slate-700">${formatBullets(data.education)}</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-black uppercase tracking-widest text-purple-900 mb-3 border-b-2 border-purple-900 pb-1">Core Skills</h3>
                            <div class="flex flex-wrap">${formatSkills(data.skills)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

        function downloadPDF() {
            const element = document.getElementById('resumeContainer');
            const options = {
                margin:       0,
                filename:     `SkillDocket-Template-${templateId}.pdf`,
                image:        { type: 'jpeg', quality: 0.99 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(options).save();
        }
    </script>
</body>
</html>
