<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumify - Build Your Free Resume</title>
    <!-- Tailwind CSS CDN for modern and clean styling -->

<body class="bg-gray-50 font-sans text-gray-900">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="text-2xl font-bold text-blue-600 tracking-wide">Resumify</div>
        <div>
            <a href="#" class="text-gray-600 hover:text-blue-600 mx-3 font-medium">Home</a>
            <a href="#templates" class="text-gray-600 hover:text-blue-600 mx-3 font-medium">Templates</a>
            <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Get Started</a>

                <a href="#templates" class="border border-gray-300 px-6 py-3 rounded-xl font-semibold text-gray-700 hover:bg-gray-100 transition">View Templates</a>

        <div class="md:w-1/2 flex justify-center">
